name: ball_narrow
model:
  image_size: 128
  patch_size: 8
  encoder_scale: tiny
  embed_dim: 256
  action_dim: 3
  history_size: 8
  predictor_kind: gru
  predictor_hidden_dim: 512
  predictor_depth: 3
  predictor_conditioning: film_concat
  predictor_dropout: 0.1
  predictor_residual_init: 0.1
  projector_hidden_dim: 2048
objective:
  prediction_weight: 0.0
  rollout_weight: 1.0
  rollout_horizon: 6
  rollout_gamma: 0.95
  target_detach: false
  sigreg_weight: 0.09
  sigreg_knots: 17
  sigreg_num_proj: 1024
train:
  epochs: 14
  batch_size: 32
  learning_rate: 0.0005
  muon_learning_rate: 0.001
  weight_decay: 0.001
  lr_schedule: warmup_cosine_cooldown
  lr_warmup_epochs: 0.5
  lr_cooldown_start_fraction: 0.8
  lr_min_factor: 0.1
  gradient_clip: 1.0
  train_fraction: 0.9
  num_workers: 8
  checkpoint_every_epochs: 4
  seed: 42
  precision: bf16
