# Semigroup-JEPA on the contact-free projectile task.
#
# Shapes follow the paper's planar configuration except for the history and
# horizon, which are set by the episode length of this scene: the constraint
# needs history + horizon <= frames_per_episode = 16, and the free-fall
# dynamics of a single object are fully determined by a short context.
# rollout_horizon matches the constraint horizon used in post-training so that
# the pretrained predictor and the post-trained one are scored on the same
# rollout length.
name: freefall_sg_jepa_gru

model:
  image_size: 128
  patch_size: 8
  encoder_scale: tiny
  embed_dim: 256
  action_dim: 3
  history_size: 8
  predictor_kind: gru
  predictor_hidden_dim: 512
  predictor_depth: 3
  predictor_conditioning: film_concat
  predictor_dropout: 0.1
  predictor_residual_init: 0.1
  projector_hidden_dim: 2048

objective:
  prediction_weight: 0.0
  rollout_weight: 1.0
  rollout_horizon: 6
  rollout_gamma: 0.95
  target_detach: false
  sigreg_weight: 0.09
  sigreg_knots: 17
  sigreg_num_proj: 1024

train:
  epochs: 20
  batch_size: 32
  learning_rate: 5.0e-5
  muon_learning_rate: 1.0e-4
  weight_decay: 1.0e-3
  lr_schedule: warmup_cosine_cooldown
  lr_warmup_epochs: 0.5
  lr_cooldown_start_fraction: 0.8
  lr_min_factor: 0.1
  gradient_clip: 1.0
  train_fraction: 0.9
  num_workers: 6
  checkpoint_every_epochs: 2
  seed: 42
  precision: bf16
