[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "gravity-wm"
version = "0.1.0"
description = "Gravity-constrained post-training of JEPA world models"
requires-python = ">=3.10,<3.13"
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["gwm"]

[tool.ruff]
line-length = 100
target-version = "py310"

# Same rule set as the sg-jepa project this builds on, so lint findings are
# comparable across the two packages.
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
markers = ["slow: needs a simulator run"]
testpaths = ["tests"]
